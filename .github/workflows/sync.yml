# Sugar Nail IG 自動同步 — 每日定時＋手動觸發，全部免費
# （GitHub Actions 免費額度 + Cloudflare Pages 免費計劃）
#
# 流程：續 token → 由 IG API 攞最新 Post → 重新 build 靜態網站
#      → commit feed.json + 新相返 repo → deploy 去 Cloudflare Pages
#
# Secrets（Repo → Settings → Secrets and variables → Actions，見 SETUP.md）：
#   IG_ACCESS_TOKEN  IG 長效 token（60 日，refresh_token.py 會定期續）
#   IG_APP_ID        Meta developer app ID（只係 refresh 用，唔係必須每日都用）
#   IG_APP_SECRET    Meta developer app secret（同上）
#   CF_API_TOKEN     Cloudflare API token（Pages:Edit + Account:Read）
#   CF_ACCOUNT_ID    Cloudflare 帳號 ID
#   GH_PAT           選填：有 repo 權限嘅 Personal Access Token，用嚟更新
#                    IG_ACCESS_TOKEN secret。唔填嘅話，續咗 token 之後
#                    要人手貼去 Secrets（workflow 會喺 log 度講明）。
#                    預設嘅 GITHUB_TOKEN 係唔可以改 Secrets 嘅。
name: IG auto-sync

on:
  schedule:
    # 每日 02:00 UTC（即香港時間 10:00）跑一次。
    # 注意：GitHub 免費 cron 有時會遲幾個鐘，唔係準時保證；
    # 趕住出新 Post 就用 Actions 頁面「Run workflow」手動跑一次。
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node（Wrangler 用）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 續 IG token（未夠 30 日就唔續）
        id: refresh
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/refresh_token.py

      - name: 更新 IG_ACCESS_TOKEN secret（如果續咗新 token）
        if: steps.refresh.outputs.new_token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN: ${{ steps.refresh.outputs.new_token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::續咗新 token，但未設定 GH_PAT secret，唔可以自動更新 IG_ACCESS_TOKEN。"
            echo "::warning::請人手將新 token 貼去 Repo Secrets → IG_ACCESS_TOKEN，否則舊 token 到期之後同步會停。"
            echo "新 token 已遮罩，只會喺呢個 log 嘅遮罩輸出入面，唔會寫入檔案。"
            exit 0
          fi
          printf '%s' "$NEW_TOKEN" | gh secret set IG_ACCESS_TOKEN --body -
          echo "IG_ACCESS_TOKEN secret 已更新。"

      - name: 由 IG API 攞最新 Post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 scripts/fetch_ig.py --max-pages 4

      - name: Build 靜態網站
        run: python3 scripts/build_site.py

      - name: Commit feed.json + 新相返 repo
        run: |
          git config user.name "sugar-nail-sync"
          git config user.email "sugar-nail-sync@users.noreply.github.com"
          git add data/feed.json data/categories.json data/token_meta.json assets/images
          if git diff --cached --quiet; then
            echo "冇新 Post，唔使 commit。"
          else
            git commit -m "auto-sync: IG 更新"
            git push
          fi

      - name: Deploy 去 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy public --project-name sugarnail --commit-dirty=true
